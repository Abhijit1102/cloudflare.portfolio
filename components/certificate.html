<section class="section" id="certificates">
  <div class="wrap">
    <div class="section-head reveal">
      <span class="eyebrow">Certifications</span>
      <h2 class="section-title">Courses &amp; <span>Certificates</span></h2>
      <p class="section-sub">Click any card to view the certificate full-size.</p>
    </div>

    <div class="cert-grid">

      <div class="gum-card cert-card reveal" data-cert="assets/images/certificates/big-data-engineering.png" data-title="Big Data Engineering Intern">
        <div class="cert-img">
          <img src="assets/images/certificates/big-data-engineering.png" alt="Big Data Engineering Intern certificate"
               onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'cert-fallback',innerHTML:'<i class=\'fa-solid fa-image\'></i><span>Add big-data-engineering.png to /assets/images/certificates</span>'}))">
        </div>
        <div class="cert-info">
          <h4>Big Data Engineering Intern</h4>
          <p>Euron · Sep 2025 – Apr 2026</p>
        </div>
      </div>

      <div class="gum-card cert-card reveal" data-cert="assets/images/certificates/fullstack-cohort.png" data-title="Full Stack Developer Cohort (0 to 100)">
        <div class="cert-img">
          <img src="assets/images/certificates/fullstack-cohort.png" alt="Full Stack Developer Cohort certificate"
               onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'cert-fallback',innerHTML:'<i class=\'fa-solid fa-image\'></i><span>Add fullstack-cohort.png to /assets/images/certificates</span>'}))">
        </div>
        <div class="cert-info">
          <h4>Full Stack Developer Cohort (0 to 100)</h4>
          <p>Instructor: Harkirat Singh · Jul 2024</p>
        </div>
      </div>

      <div class="gum-card cert-card reveal" data-cert="assets/images/certificates/data-science-masters.png" data-title="Data Science Masters Certification">
        <div class="cert-img">
          <img src="assets/images/certificates/data-science-masters.png" alt="Data Science Masters Certification"
               onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'cert-fallback',innerHTML:'<i class=\'fa-solid fa-image\'></i><span>Add data-science-masters.png to /assets/images/certificates</span>'}))">
        </div>
        <div class="cert-info">
          <h4>Data Science Masters Certification</h4>
          <p>PW Skills · Nov 2023</p>
        </div>
      </div>

    </div>
  </div>
</section>

<!-- Lightbox for certificate viewing -->
<div class="lightbox" id="certLightbox">
  <button class="lightbox-close" id="certLightboxClose"><i class="fa-solid fa-xmark"></i></button>
  <div class="lightbox-inner">
    <img id="certLightboxImg" src="" alt="Certificate full view">
  </div>
</div>
